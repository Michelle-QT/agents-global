# Optional Codex profile installed by `make codex`.
#
# This intentionally lives as a profile, not ~/.codex/config.toml, so installing
# this repo does not overwrite machine-local Codex state such as trusted projects
# or account-specific model choices.

model_reasoning_effort = "xhigh"
personality = "pragmatic"

[tui]
vim_mode_default = true
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "bel"
status_line = ["model-with-reasoning", "context-remaining", "git-branch"]
